[project]
name = "flight-beam-based-alignment"
version = "0.1.0"
description = "Beam based alignment with correctors or quadrupole movers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.flight-simulator.migration]
status = "file-layout-prepared-import-migration-pending"
repository-dependencies = ["machine-interfaces", "response-matrix"]
