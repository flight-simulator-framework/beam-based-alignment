[project]
name = "flight-beam-based-alignment"
version = "0.1.0"
description = "Beam based alignment with correctors or quadrupole movers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "machine-interfaces[epics,madx,rftrack,tao]>=0.1.0,<0.2.0",
    "flight-response-matrix>=0.1.0,<0.2.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "beam_based_alignment"}, {include = "BBA_GUI.py"}, {include = "BBA_QM_GUI.py"}]

[tool.poetry.dependencies]
machine-interfaces = {path = "../machine-interfaces", develop = true, extras = ["epics", "madx", "rftrack", "tao"]}
flight-response-matrix = {path = "../response-matrix", develop = true}

[tool.flight-simulator.migration]
status = "local-execution-ready"
repository-dependencies = ["machine-interfaces", "response-matrix"]
